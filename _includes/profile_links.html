{% if page.profile.links %}
<nav class="profile-links" aria-label="Profile links">
  {% if page.profile.links.email %}
  <a href="mailto:{{ page.profile.links.email | encode_email }}" title="Email" aria-label="Email">
    <i class="fas fa-envelope" aria-hidden="true"></i>
  </a>
  {% endif %}
  {% if page.profile.links.cv %}
  <a href="{{ page.profile.links.cv | relative_url }}" target="_blank" rel="noopener noreferrer" title="CV" aria-label="CV">
    <i class="ai ai-cv" aria-hidden="true"></i>
  </a>
  {% endif %}
  {% if page.profile.links.scholar %}
  <a href="{{ page.profile.links.scholar | escape }}" target="_blank" rel="noopener noreferrer" title="Google Scholar" aria-label="Google Scholar">
    <i class="ai ai-google-scholar" aria-hidden="true"></i>
  </a>
  {% endif %}
  {% if page.profile.links.github %}
  <a href="{{ page.profile.links.github | escape }}" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
    <i class="fab fa-github" aria-hidden="true"></i>
  </a>
  {% endif %}
  {% if page.profile.links.linkedin %}
  <a href="{{ page.profile.links.linkedin | escape }}" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn">
    <i class="fab fa-linkedin" aria-hidden="true"></i>
  </a>
  {% endif %}
</nav>
{% endif %}
